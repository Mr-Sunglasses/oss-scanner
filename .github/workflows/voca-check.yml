# Throwaway: runs tools/check for a Voca project on x86-64. Lives only on the ci-check branch of this fork.
name: voca-check
on:
  workflow_dispatch:
    inputs:
      name: { description: "project name", required: true }
      repo: { description: "repo URL with #branch", required: true }
      test: { description: "command to run in the built image with no network", required: false, default: "true" }
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Free disk
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android /opt/hostedtoolcache/CodeQL && df -h /
      - run: pip install pyyaml
      - name: Write project.yaml
        run: |
          mkdir -p projects/${{ inputs.name }}
          printf 'repo: %s\nprimary_contact: kanishk@vocahq.com\ndockerfile: .oss-scanner/Dockerfile\nthreat_model: .oss-scanner/threat_model.md\n' '${{ inputs.repo }}' > projects/${{ inputs.name }}/project.yaml
          python3 tools/validate.py
      - name: Build like the scanner
        run: python3 tools/check --no-shell ${{ inputs.name }}
      - name: Run tests offline (2 CPU / 8 GB, like a scan agent)
        run: docker run --rm --network none --cpus 2 --memory 8g -w /src oss-scanner-check/built:${{ inputs.name }} bash -lc '${{ inputs.test }}'
